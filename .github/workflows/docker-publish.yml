name: docker-publish

on:
  workflow_dispatch:
    inputs:
      napcat_version:
        description: 'NapCat release tag (empty selects the latest release once)'
        required: false
        type: string

jobs:
  publish-dockerhub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get artifacts
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAPCAT_VERSION: ${{ inputs.napcat_version }}
        run: |
          if [ -z "$NAPCAT_VERSION" ]; then
            NAPCAT_VERSION=$(curl -fLsS --connect-timeout 15 --max-time 60 \
              -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/NapNeko/NapCatQQ/releases/latest | jq -er '.tag_name')
          fi
          [[ "$NAPCAT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$NAPCAT_VERSION" >> "$GITHUB_OUTPUT"
          bash get_artifacts.sh "$GH_TOKEN" "$NAPCAT_VERSION"
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Fork from https://github.com/koishijs/boilerplate/blob/master/.github/workflows/docker.yml
      - name: Run buildx and push
        env:
          DOCKER_REPO: mlikiowa/napcat-docker
          NAPCAT_VERSION: ${{ steps.release.outputs.tag }}
        run: |
          docker buildx build \
            --output "type=image,push=true" \
            --platform linux/amd64,linux/arm64 \
            --tag "${DOCKER_REPO}:$NAPCAT_VERSION" \
            --tag "${DOCKER_REPO}:latest" \
            --file ./Dockerfile \
            .
      - name: Docker Hub logout
        if: always()
        run: docker logout
